version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: watchy
      POSTGRES_USER: watchy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./migrations:/migrations

  backend:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - IS_DOCKER=true
      - PORT=3000
      - DATABASE_URL=postgresql://watchy:${POSTGRES_PASSWORD}@postgres:5432/watchy
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
    command: npm run dev

volumes:
  pgdata:
